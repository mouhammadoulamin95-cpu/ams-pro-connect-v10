<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMS Pro Connect V10</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f4f7fb;color:#172033}.app{max-width:1100px;margin:auto;min-height:100vh}.top{background:#123c69;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800}.badge{font-size:11px;background:#16a085;padding:5px 9px;border-radius:20px}.card{background:white;margin:16px;border-radius:16px;padding:18px;box-shadow:0 5px 20px #14233b12}.login{max-width:430px;margin:8vh auto}.input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #d7deea;font:inherit}.primary{background:#123c69;color:white;border:0;font-weight:700}.secondary{background:#edf2f7;border:0}.grid{display:grid;grid-template-columns:280px 1fr;gap:14px;padding:14px}.clients button{text-align:left;background:white;border:1px solid #e3e8ef}.chat{height:65vh;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:10px;background:#f8fafc;border-radius:12px}.msg{max-width:78%;padding:10px 12px;margin:7px 0;border-radius:13px}.client{background:#e7eef7}.admin{background:#dff5ee;margin-left:auto}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1}.composer button{width:auto}.hide{display:none}.small{font-size:12px;color:#697586}@media(max-width:700px){.grid{grid-template-columns:1fr}.clients{display:flex;overflow:auto}.clients button{min-width:190px}.chat{height:58vh}}
</style></head><body><div id="root"></div><script src="/socket.io/socket.io.js"></script><script>
const $=x=>document.querySelector(x);let me=null,current=null,socket=io();
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function login(){root.innerHTML=`<div class="card login"><h1>AMS Pro Connect</h1><p class="small">Espace sécurisé client / AMS Pro</p><input id="phone" class="input" placeholder="Téléphone"><input id="pass" type="password" class="input" placeholder="Mot de passe"><button class="primary" onclick="doLogin()">Se connecter</button><hr><p>Pas encore de compte ?</p><input id="rn" class="input" placeholder="Nom / entreprise"><button class="secondary" onclick="register()">Créer mon compte client</button><div id="err"></div></div>`}
async function doLogin(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:phone.value,password:pass.value})});let x=await r.json();if(!r.ok)return err.textContent=x.error;me=x;openApp()}
async function register(){let n=rn.value,p=phone.value,pw=pass.value;if(!n||!p||!pw)return err.textContent="Remplissez nom, téléphone et mot de passe.";let r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,phone:p,password:pw})});let x=await r.json();if(!r.ok)return err.textContent=x.error;me=x;openApp()}
async function openApp(){root.innerHTML=`<div class="top"><div class="brand">AMS Pro Connect <span class="badge">V10 ONLINE</span></div><button style="width:auto;background:#ffffff22;color:white;border:0" onclick="login()">Déconnexion</button></div>${me.role==="admin"?`<div class="grid"><div class="clients card"><h3>Clients</h3><div id="cl"></div></div><div class="chat card"><h3 id="ct">Sélectionnez un client</h3><div id="msgs" class="msgs"></div><div class="composer"><input id="body" placeholder="Écrire un message…"><button class="primary" onclick="send()">Envoyer</button></div></div></div>`:`<div class="card"><h2>Bonjour ${esc(me.name)} 👋</h2><p>Votre espace AMS Pro est connecté.</p><div class="chat"><div id="msgs" class="msgs"></div><div class="composer"><input id="body" placeholder="Écrire à AMS Pro…"><button class="primary" onclick="send()">Envoyer</button></div></div></div>`;socket.emit("join",me.id);if(me.role==="admin")loadClients();else{current=me;loadMessages(me.id)}}
async function loadClients(){let r=await fetch("/api/clients"),xs=await r.json();cl.innerHTML=xs.map(x=>`<button onclick='selectClient(${JSON.stringify(x)})'>💬 ${esc(x.name)}<br><span class="small">${esc(x.phone)}</span></button>`).join("")}
function selectClient(x){current=x;ct.textContent="💬 "+x.name;socket.emit("join",x.id);loadMessages(x.id)}
async function loadMessages(id){let r=await fetch("/api/messages/"+id),xs=await r.json();msgs.innerHTML=xs.map(render).join("");msgs.scrollTop=msgs.scrollHeight}
function render(x){return `<div class="msg ${x.sender_role}"><div>${esc(x.body)}</div><span class="small">${new Date(x.created_at).toLocaleString("fr-FR")}</span></div>`}
async function send(){if(!current||!body.value.trim())return;await fetch("/api/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({clientId:current.id,senderRole:me.role,body:body.value.trim()})});body.value=""}
socket.on("message",m=>{if(current&&+current.id===+m.client_id){msgs.insertAdjacentHTML("beforeend",render(m));msgs.scrollTop=msgs.scrollHeight}});
login();
</script></body></html>
